apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
spec:
  replicas: 1
  # Un seul poller Telegram a la fois : l'ancien pod s'arrete avant le nouveau.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
    spec:
      terminationGracePeriodSeconds: 60  # laisse le temps de vider la file avant l'arret
      securityContext:
        runAsUser: {{ .Values.uid }}
        runAsNonRoot: true
        fsGroup: {{ .Values.uid }}
      containers:
        - name: app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: PUBLIC_BASE_URL
              value: "https://{{ .Values.hostname }}"
            - name: LIBRARY_REPO_URL
              value: {{ .Values.libraryRepoUrl | quote }}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 15
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 30
            periodSeconds: 30
          volumeMounts:
            - name: data
              mountPath: /data
            - name: app-secrets
              mountPath: /secrets/app
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-data
        - name: app-secrets
          secret:
            secretName: {{ .Values.secretName }}
            defaultMode: 0440

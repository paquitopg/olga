[project]
name = "second-brain"
version = "0.1.0"
description = "Bureau d'idees sur Telegram avec bibliotheque privee"
requires-python = ">=3.11"
dependencies = [
  "aiogram>=3.31,<4",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "jinja2>=3.1",
  "markdown-it-py>=3.0",
  "itsdangerous>=2.2",
  "python-multipart>=0.0.9",
  "pyyaml>=6.0",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["app"]
testpaths = ["tests"]
